<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Discovery — My Agent</title>
  <style>
/* Knowledge Discovery — shared UI (Phase 1 redesign)
   Principle: humans are large, agents are small. No robot/brain icons.
   Light theme. Warm accent reserved for a made connection only.
   NOTE: server.py serves only /requester /candidate /audit as raw HTML files
   (no static mount for this directory), so this file's content is inlined
   into requester.html's <style> tag rather than linked. Keep both in sync
   with web/ui.css. */

:root {
  --bg: #F7F5F1;
  --card-bg: #FFFFFF;
  --border: #E4DFD3;
  --border-strong: #D4CDBC;
  --text: #232323;
  --text-muted: #6B6659;
  --text-faint: #948E7D;
  --primary: #1F3A5F;
  --primary-hover: #16304F;
  --primary-tint: #EAF0F6;
  --accent: #C96F4A;      /* used only when a connection is made */
  --accent-tint: #FBEEE7;
  --warn: #B5560C;        /* overdue: warm, but distinct from the connection accent */
  --warn-tint: #FBEFE3;
  --muted-tag-bg: #EFEBE1;
  --muted-tag-text: #6B6659;
  --today-bg: #EAF0F6;
  --today-text: #1F3A5F;
  --radius: 8px;
  --radius-sm: 6px;
  --shadow-card: 0 1px 2px rgba(35, 35, 35, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }

html, body { background: var(--bg); color: var(--text); }
body { min-height: 100vh; font-size: 14px; line-height: 1.5; }

a { color: inherit; }

button {
  font-family: var(--font);
  cursor: pointer;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
button.btn-primary { background: var(--primary); color: #fff; }
button.btn-primary:hover { background: var(--primary-hover); }
button.btn-primary:disabled { opacity: 0.6; cursor: default; }
button.btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border-strong); }
button.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
button.btn-text { background: transparent; color: var(--text-muted); padding: 4px 8px; font-size: 12px; }
button.btn-text:hover { color: var(--primary); }

textarea, input[type="text"] {
  width: 100%;
  font-family: var(--font);
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  resize: vertical;
}
textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--primary); }

/* ---------------- App shell ---------------- */

.app-shell { display: flex; min-height: 100vh; align-items: stretch; }

.sidebar {
  width: 220px;
  flex: 0 0 220px;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
}
.sidebar-logo { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.01em; margin-bottom: 32px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav a {
  display: block;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 9px 10px;
  border-radius: var(--radius-sm);
}
.sidebar-nav a:hover { background: var(--bg); color: var(--text); }
.sidebar-nav a.active { background: var(--primary-tint); color: var(--primary); }
.sidebar-spacer { flex: 1; }
.sidebar-footer { font-size: 11px; color: var(--text-faint); line-height: 1.5; font-style: italic; }

.main { flex: 1; min-width: 0; padding: 36px 40px 60px; }
.main-inner { max-width: 880px; margin: 0 auto; }

.api-key-warning { background: var(--warn); color: #fff; padding: 8px 16px; font-size: 13px; margin: -36px -40px 24px; }

/* ---------------- Header ---------------- */

.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
.greeting { font-size: 22px; font-weight: 600; color: var(--text); }
.agent-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); display: inline-block; animation: dot-pulse 2.2s infinite; }
@keyframes dot-pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }

.persona-select {
  font-size: 12px;
  color: var(--text-muted);
  background: #fff;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 5px 12px;
}

/* ---------------- Section ---------------- */

.section { margin-bottom: 28px; }
.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 18px 20px;
}
.card + .card { margin-top: 10px; }

/* ---------------- Today: reminders ---------------- */

.reminder-list { display: flex; flex-direction: column; gap: 6px; }
.reminder-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 14px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
}
.reminder-row .reminder-title { font-weight: 500; color: var(--text); }
.empty-note { font-size: 13px; color: var(--text-faint); padding: 10px 2px; }

.tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.tag-overdue { background: var(--warn-tint); color: var(--warn); }
.tag-today { background: var(--today-bg); color: var(--today-text); }
.tag-tomorrow, .tag-upcoming { background: var(--muted-tag-bg); color: var(--muted-tag-text); }

/* ---------------- Suggestion (profile diff) ---------------- */

.suggest-card { border-left: 3px solid var(--primary); }
.suggest-label { font-size: 11px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.suggest-subject { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.suggest-preview {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--text);
  margin-bottom: 10px;
}
.suggest-edit-box { display: none; margin-bottom: 10px; }
.suggest-edit-box textarea { height: 60px; margin-bottom: 8px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------- Need Detection (stagnation) ---------------- */

.need-card { display: flex; flex-direction: column; gap: 10px; }
.need-evidence { font-size: 12px; color: var(--warn); background: var(--warn-tint); display: inline-block; padding: 4px 10px; border-radius: var(--radius-sm); width: fit-content; }
.need-task-title { font-size: 15px; font-weight: 600; color: var(--text); }
.need-copy { font-size: 13px; color: var(--text-muted); line-height: 1.55; max-width: 60ch; }

.explore-transition { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.explore-spark { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); animation: dot-pulse 0.9s infinite; }
.explore-copy { font-size: 13px; color: var(--text-muted); }

/* ---------------- Person card ---------------- */

.person-card { display: flex; gap: 16px; align-items: flex-start; }
.avatar {
  flex: 0 0 auto;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--primary-tint);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 17px;
}
.avatar.avatar-sm { width: 30px; height: 30px; font-size: 12px; }
.person-main { flex: 1; min-width: 0; }
.person-name { font-size: 18px; font-weight: 600; color: var(--text); }
.person-role { font-size: 13px; color: var(--text-muted); margin-top: 1px; margin-bottom: 10px; }
.person-why { font-size: 12px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.person-reasons { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.person-reasons li { font-size: 13px; color: var(--text); padding-left: 14px; position: relative; line-height: 1.5; }
.person-reasons li::before { content: "–"; position: absolute; left: 0; color: var(--text-faint); }
.ai-disclosure { font-size: 10.5px; color: var(--text-faint); margin-bottom: 10px; }
.person-timing { font-size: 13px; color: var(--text); font-weight: 500; margin-bottom: 10px; }
.question-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; }
.question-box { height: 68px; margin-bottom: 6px; }
.fixed-notice { font-size: 11px; color: var(--text-faint); font-style: italic; margin-bottom: 12px; }

.secondary-candidates { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.secondary-candidate-row { display: flex; align-items: center; gap: 10px; }
.secondary-candidate-text { font-size: 12.5px; color: var(--text-muted); }
.secondary-candidate-text strong { color: var(--text); font-weight: 600; }

/* ---------------- Connection Requests ---------------- */

.status-row { display: flex; flex-direction: column; gap: 10px; }
.status-card { padding: 16px 18px; }
.status-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.status-name { font-size: 14px; font-weight: 600; color: var(--text); }
.status-body { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.status-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.status-tag.waiting { background: var(--muted-tag-bg); color: var(--muted-tag-text); }
.status-tag.created { background: var(--accent-tint); color: var(--accent); }
.status-tag.shared { background: var(--today-bg); color: var(--today-text); }

.attachment-box { margin-top: 10px; padding: 10px 12px; background: var(--bg); border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); font-size: 12.5px; }
.attachment-box a { color: var(--primary); text-decoration: none; }
.attachment-box a:hover { text-decoration: underline; }

/* ---------------- Connection Created ---------------- */

.connection-created { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 6px 0 4px; }
.connection-pair { display: flex; align-items: center; gap: 0; }
.connection-line {
  height: 2px;
  width: 0;
  background: var(--accent);
  animation: line-grow 0.7s ease-out forwards;
}
@keyframes line-grow { from { width: 0; } to { width: 90px; } }
.connection-caption { font-size: 14px; font-weight: 600; color: var(--accent); }
.connection-sub { font-size: 12.5px; color: var(--text-muted); }

/* ---------------- Manual ask (de-emphasized) ---------------- */

.manual-ask summary { font-size: 12.5px; color: var(--text-muted); cursor: pointer; list-style: none; }
.manual-ask summary::-webkit-details-marker { display: none; }
.manual-ask summary:before { content: "Ask your agent  ›"; }
.manual-ask[open] summary:before { content: "Ask your agent  ⌄"; }
.manual-ask-body { margin-top: 12px; }
.manual-ask .demo-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.preset-btn { font-size: 11.5px; padding: 5px 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); border-radius: 999px; }
.preset-btn:hover { color: var(--text); border-color: var(--border-strong); }
.manual-ask textarea { height: 84px; margin-bottom: 10px; }
.info-bar { font-size: 12px; color: var(--text-faint); margin-top: 8px; }
.live-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--primary); margin-left: 4px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo">Knowledge Discovery</div>
      <nav class="sidebar-nav">
        <a href="/requester" class="active">My Agent</a>
        <a id="navCandidate" href="/candidate">Connection Requests</a>
        <a id="navAudit" href="/audit">Bridge Trace</a>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-footer">AI shouldn't replace human connections. It should create them.</div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <div class="page-header">
          <div>
            <div class="greeting" id="greeting">Good morning</div>
            <div class="agent-badge"><span class="pulse-dot"></span> Your agent</div>
          </div>
          <!-- Demo device: same one-person-plays-all dropdown as candidate.html (README: demo simplification). R-1 -->
          <select id="requesterSelect" class="persona-select" onchange="switchRequester(this.value)" title="Demo: switch whose screen you are viewing">
            <option value="emp_jordan_lee" selected>Jordan Lee (Staffing)</option>
            <option value="emp_marcus_delgado">Marcus Delgado</option>
            <option value="emp_rachel_kim">Rachel Kim</option>
            <option value="emp_elena_vasquez">Elena Vasquez</option>
            <option value="emp_tom_whitfield">Tom Whitfield</option>
          </select>
        </div>

        <!-- TODAY -->
        <div class="section">
          <div class="section-title">
            <span id="digestDateBadge">Today</span>
            <span class="btn-row">
              <button class="btn-text" onclick="triggerSweep()">Run sweep</button>
              <button class="btn-text" onclick="fetchDigest()">Refresh</button>
            </span>
          </div>
          <div class="reminder-list" id="reminderList">
            <div class="empty-note">Loading daily schedule...</div>
          </div>
          <div id="todaySuggestions" style="margin-top: 10px;"></div>
        </div>

        <!-- Need Detection -->
        <div class="section" id="needDetectionSection"></div>

        <!-- Connection Requests -->
        <div class="section">
          <div class="section-title">
            <span>Connection Requests</span>
            <button class="btn-text" onclick="fetchStatuses()">Refresh</button>
          </div>
          <div id="statusContainer" class="status-row">
            <div class="empty-note">No requests yet. Ask for an intro above to get started.</div>
          </div>
        </div>

        <!-- Manual ask (de-emphasized) -->
        <details class="manual-ask">
          <summary></summary>
          <div class="manual-ask-body">
            <div class="demo-presets">
              <button class="preset-btn" onclick="setQuestion(1)">Demo 1: Clinic Relocation &amp; Zoning</button>
              <button class="preset-btn" onclick="setQuestion(2)">Demo 2: Practice Succession &amp; Retirement</button>
              <button class="preset-btn" onclick="setQuestion(3)">Demo 3: General Inquiries</button>
            </div>
            <textarea id="questionText" placeholder="Describe the implicit background, tacit experience, or specialized knowledge you need..."></textarea>
            <div class="btn-row">
              <button id="submitBtn" class="btn-primary" onclick="submitInquiry()">Ask</button>
              <button class="btn-secondary" onclick="clearForm()">Clear</button>
              <span id="liveStatus" class="live-indicator" style="display:none;"><span class="pulse-dot"></span> Live</span>
            </div>
            <div id="queryMeta" class="info-bar"></div>
          </div>
        </details>
      </div>
    </main>
  </div>

  <script>
/* Knowledge Discovery — My Agent (requester) UI logic, Phase 1 redesign.
   NOTE: server.py does not statically serve this directory (only the raw
   HTML shells at /requester /candidate /audit), so this exact content is
   inlined here. Keep in sync with web/ui.js. */

const API_KEY = (new URLSearchParams(location.search)).get("api_key") || "";

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Demo persona directory (README: one-person-plays-all demo device, R-1).
// /api/me does not return a display name, so first names shown in the
// greeting / connection graphics are looked up from this fixed demo roster.
const PERSONA_DIRECTORY = {
  emp_jordan_lee: "Jordan Lee",
  emp_marcus_delgado: "Marcus Delgado",
  emp_rachel_kim: "Rachel Kim",
  emp_elena_vasquez: "Elena Vasquez",
  emp_tom_whitfield: "Tom Whitfield",
};

function displayName(idOrName) {
  if (!idOrName) return "Colleague";
  if (PERSONA_DIRECTORY[idOrName]) return PERSONA_DIRECTORY[idOrName];
  return idOrName;
}

function firstName(idOrName) {
  const full = displayName(idOrName);
  return full.split(" ")[0];
}

function initials(fullName) {
  const parts = String(fullName || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

let REQUESTER_ID = "emp_jordan_lee";
let pollInterval = null;
const STAG_CARDS = {}; // card_id -> latest card payload, for the reveal flow

function withKey(path) {
  return path + (path.includes("?") ? "&" : "?") + "api_key=" + encodeURIComponent(API_KEY);
}

function setupChrome() {
  if (!API_KEY) {
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="api-key-warning">Missing api_key: open this page as /requester?api_key=YOUR_KEY</div>');
  }
  const candLink = document.getElementById("navCandidate");
  const auditLink = document.getElementById("navAudit");
  if (candLink) candLink.href = withKey("/candidate");
  if (auditLink) auditLink.href = withKey("/audit");
}

function switchRequester(id) {
  REQUESTER_ID = id;
  fetchDigest();
  fetchStatuses();
}

// -------------------------------------------------------------------------
// Principal resolution (design §16.1): a "human" caller is pinned to their
// own employee_id and cannot switch personas via the demo dropdown.
// -------------------------------------------------------------------------

async function initPrincipal() {
  try {
    const res = await fetch(`/api/me`, { headers: { "X-API-Key": API_KEY } });
    if (!res.ok) return;
    const me = await res.json();
    if (me.mode === "human" && me.employee_id) {
      REQUESTER_ID = me.employee_id;
      const sel = document.getElementById("requesterSelect");
      if (sel) sel.style.display = "none";
    }
  } catch (err) {
    console.error("me fetch error:", err);
  }
  document.getElementById("greeting").innerText = `Good morning, ${firstName(REQUESTER_ID)}`;
}

// -------------------------------------------------------------------------
// Manual "Ask your agent" (kept, de-emphasized)
// -------------------------------------------------------------------------

const DEMO_QUESTIONS = {
  1: "A hospital client of mine wants to relocate one of their clinics. Who in our group knows how to find sites that can actually host a medical facility — zoning, conversion, that kind of thing?",
  2: "The owner of a small clinic I work with mentioned she's thinking about retiring in a few years. Who has experience with practice succession conversations?",
  3: "We need someone with experience in ambulatory surgical center operational licensing and state compliance documentation."
};

function setQuestion(num) {
  document.getElementById("questionText").value = DEMO_QUESTIONS[num] || "";
}

function clearForm() {
  document.getElementById("questionText").value = "";
  document.getElementById("queryMeta").innerText = "";
}

async function submitInquiry() {
  const q = document.getElementById("questionText").value.trim();
  if (!q) {
    alert("Please enter a question.");
    return;
  }
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerText = "Dispatching...";

  try {
    const res = await fetch("/api/query", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ requester_id: REQUESTER_ID, question_text: q })
    });
    const data = await res.json();
    if (!res.ok) {
      alert("Error dispatching query: " + (data.detail || "Unknown error"));
      return;
    }

    document.getElementById("queryMeta").innerText =
      `Inquiry ID: ${data.query_id} · dispatched to ${data.dispatched_count} candidate agent(s)`;
    document.getElementById("liveStatus").style.display = "inline-flex";
    await fetchStatuses();

    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(fetchStatuses, 2000);
  } catch (err) {
    alert("Failed to connect to server: " + err.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerText = "Ask";
  }
}

// -------------------------------------------------------------------------
// Digest: TODAY reminders + "Your agent suggests" (profile diff) cards
// -------------------------------------------------------------------------

async function fetchDigest() {
  try {
    const res = await fetch(`/api/secretary/digest?employee_id=${REQUESTER_ID}`, {
      headers: { "X-API-Key": API_KEY }
    });
    if (!res.ok) return;
    const data = await res.json();
    renderDigest(data);
  } catch (err) {
    console.error("Digest fetch error:", err);
  }
}

async function triggerSweep() {
  try {
    const res = await fetch("/api/secretary/sweep", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({})
    });
    if (!res.ok) {
      alert("Sweep failed: " + res.statusText);
      return;
    }
    await fetchDigest();
  } catch (err) {
    alert("Sweep error: " + err.message);
  }
}

function renderDigest(data) {
  document.getElementById("digestDateBadge").innerText = data.date ? ("Today \u00b7 " + data.date) : "Today";

  // Reminders
  const reminderList = document.getElementById("reminderList");
  const reminders = data.reminders || [];
  if (reminders.length === 0) {
    reminderList.innerHTML = '<div class="empty-note">No pending schedule deadlines for today.</div>';
  } else {
    reminderList.innerHTML = reminders.map(r => {
      let tagClass = "tag-upcoming";
      let tagText = r.due_date;
      if (r.due_category === "overdue") { tagClass = "tag-overdue"; tagText = "Overdue"; }
      else if (r.due_category === "today") { tagClass = "tag-today"; tagText = "Due today"; }
      else if (r.due_category === "tomorrow") { tagClass = "tag-tomorrow"; tagText = "Due tomorrow"; }
      return `
        <div class="reminder-row">
          <span class="reminder-title">${esc(r.title)}</span>
          <span class="tag ${tagClass}">${esc(tagText)} · ${esc(r.due_date)}</span>
        </div>`;
    }).join("");
  }

  // "Your agent suggests" (profile diff cards) — stays inside TODAY
  const suggestContainer = document.getElementById("todaySuggestions");
  const diffCards = data.profile_diff_cards || [];
  suggestContainer.innerHTML = diffCards.map(renderSuggestCard).join("");

  // Need Detection (stagnation cards) — its own section below TODAY
  const needContainer = document.getElementById("needDetectionSection");
  const stagCards = data.stagnation_cards || [];
  stagCards.forEach(c => { STAG_CARDS[c.card_id] = c; });
  if (stagCards.length === 0) {
    needContainer.innerHTML = "";
  } else {
    needContainer.innerHTML = stagCards.map(renderNeedCard).join("");
  }
}

function renderSuggestCard(card) {
  const p = card.payload || {};
  return `
    <div class="card suggest-card" id="card_box_${esc(card.card_id)}">
      <div class="suggest-label">Your agent suggests</div>
      <div class="suggest-subject">From a recent email: <strong>${esc(p.subject || "Email")}</strong></div>
      <div class="suggest-preview">[${esc(p.item_key || "current_work")}] ${esc(p.body_draft || "")}</div>
      <div id="diff_edit_box_${esc(card.card_id)}" class="suggest-edit-box">
        <textarea id="diff_edit_text_${esc(card.card_id)}">${esc(p.body_draft || "")}</textarea>
        <button class="btn-primary" onclick="submitEditDiff('${esc(card.card_id)}')">Save &amp; apply</button>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="reviewDiff('${esc(card.card_id)}', 'apply')">Apply</button>
        <button class="btn-secondary" onclick="toggleEditDiff('${esc(card.card_id)}')">Edit &amp; apply</button>
        <button class="btn-secondary" onclick="reviewDiff('${esc(card.card_id)}', 'private_apply')">Apply as private</button>
        <button class="btn-text" onclick="reviewDiff('${esc(card.card_id)}', 'dismiss')">Skip</button>
      </div>
    </div>`;
}

async function reviewDiff(cardId, action, editedBody = null) {
  try {
    const res = await fetch(`/api/secretary/profile-diff/${encodeURIComponent(cardId)}/review`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ action, edited_body: editedBody })
    });
    const data = await res.json();
    if (!res.ok) {
      alert("Review failed: " + (data.detail || "Error"));
      return;
    }
    await fetchDigest();
  } catch (err) {
    alert("Review error: " + err.message);
  }
}

function toggleEditDiff(cardId) {
  const box = document.getElementById(`diff_edit_box_${cardId}`);
  if (box) box.style.display = (box.style.display === "none" || !box.style.display) ? "block" : "none";
}

async function submitEditDiff(cardId) {
  const textEl = document.getElementById(`diff_edit_text_${cardId}`);
  const edited = textEl ? textEl.value.trim() : "";
  await reviewDiff(cardId, "edit_apply", edited);
}

// -------------------------------------------------------------------------
// Need Detection: "It looks like this is stalling" -> Find someone -> reveal
// -------------------------------------------------------------------------

function renderNeedCard(card) {
  const p = card.payload || {};
  return `
    <div class="card need-card" id="card_box_${esc(card.card_id)}" data-state="initial">
      <span class="need-evidence">${esc(p.evidence_line || "This is stalling.")}</span>
      <div class="need-task-title">${esc(p.task_title || p.task_id)}</div>
      ${card.tier === "request_draft" ? `
      <div class="need-copy">It looks like this is stalling. I can look across your organization for someone who has relevant experience.</div>
      <div class="btn-row">
        <button class="btn-primary" onclick="findSomeone('${esc(card.card_id)}')">Find someone who can help</button>
        <button class="btn-text" onclick="dismissCard('${esc(card.card_id)}')">Dismiss</button>
      </div>` : `
      <div class="need-copy">Your agent is keeping an eye on this task. If it keeps stalling, it will look for someone who can help.</div>
      <div class="btn-row">
        <button class="btn-text" onclick="dismissCard('${esc(card.card_id)}')">Dismiss</button>
      </div>`}
    </div>`;
}

function findSomeone(cardId) {
  const box = document.getElementById(`card_box_${cardId}`);
  if (!box) return;
  box.dataset.state = "exploring";
  box.innerHTML = `
    <div class="explore-transition">
      <span class="explore-spark"></span>
      <span class="explore-copy">Looking across your organization…</span>
    </div>`;
  setTimeout(() => revealCandidates(cardId), 1700);
}

function revealCandidates(cardId) {
  const box = document.getElementById(`card_box_${cardId}`);
  const card = STAG_CARDS[cardId];
  if (!box || !card) return;
  box.dataset.state = "revealed";
  const p = card.payload || {};
  const cands = (p.preview && p.preview.candidates) ? p.preview.candidates : [];

  if (cands.length === 0) {
    box.innerHTML = `
      <div class="need-task-title">${esc(p.task_title || p.task_id)}</div>
      <div class="need-copy">No matching colleagues found across public profiles yet.</div>
      <div class="btn-row"><button class="btn-text" onclick="dismissCard('${esc(cardId)}')">Dismiss</button></div>`;
    return;
  }

  const top = cands[0];
  const rest = cands.slice(1);

  box.innerHTML = `
    <div class="person-card">
      <div class="avatar">${esc(initials(top.name || top.employee_id))}</div>
      <div class="person-main">
        <div class="person-name">${esc(top.name || top.employee_id)}</div>
        <div class="person-why">Why ${esc((top.name || top.employee_id).split(" ")[0])}?</div>
        <ul class="person-reasons"><li>${esc(top.reason_text || "")}</li></ul>
        <div class="ai-disclosure">🤖 Generated by AI</div>
        <div class="person-timing">15 min should be enough.</div>
        <label class="question-label" for="draft_${esc(cardId)}">Question draft (edit before sending)</label>
        <textarea id="draft_${esc(cardId)}" class="question-box">${esc(p.question_draft || "")}</textarea>
        <div class="fixed-notice">Candidates may differ at request time — the full search runs only after you confirm.</div>
        <div class="btn-row">
          <button class="btn-primary" onclick="confirmStagnationCard('${esc(cardId)}')">Ask for 15 min</button>
          <button class="btn-text" onclick="dismissCard('${esc(cardId)}')">Dismiss</button>
        </div>
        ${rest.length > 0 ? `
          <div class="secondary-candidates">
            ${rest.map(c => `
              <div class="secondary-candidate-row">
                <div class="avatar avatar-sm">${esc(initials(c.name || c.employee_id))}</div>
                <div class="secondary-candidate-text"><strong>${esc(c.name || c.employee_id)}</strong> — ${esc(c.reason_text || "")}</div>
              </div>`).join("")}
          </div>` : ""}
      </div>
    </div>`;
}

async function confirmStagnationCard(cardId) {
  const textarea = document.getElementById(`draft_${cardId}`);
  const editedQuestion = textarea ? textarea.value.trim() : "";
  if (!editedQuestion) {
    alert("Please enter a question to dispatch.");
    return;
  }
  try {
    const res = await fetch("/api/secretary/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ card_id: cardId, edited_question: editedQuestion })
    });
    const data = await res.json();
    if (!res.ok) {
      alert("Confirm failed: " + (data.detail || "Error"));
      return;
    }

    document.getElementById("queryMeta").innerText = `Inquiry ID: ${data.query_audit_id} · dispatched via your agent`;
    document.getElementById("liveStatus").style.display = "inline-flex";

    await fetchDigest();
    await fetchStatuses();

    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(fetchStatuses, 2000);
  } catch (err) {
    alert("Confirm error: " + err.message);
  }
}

async function dismissCard(cardId) {
  try {
    const res = await fetch(`/api/secretary/cards/${encodeURIComponent(cardId)}/dismiss`, {
      method: "POST",
      headers: { "X-API-Key": API_KEY }
    });
    if (!res.ok) {
      alert("Dismiss failed");
      return;
    }
    delete STAG_CARDS[cardId];
    await fetchDigest();
  } catch (err) {
    alert("Dismiss error: " + err.message);
  }
}

// -------------------------------------------------------------------------
// Connection Requests (status)
// -------------------------------------------------------------------------

async function fetchStatuses() {
  try {
    const res = await fetch(`/api/requester/${REQUESTER_ID}/status`, {
      headers: { "X-API-Key": API_KEY }
    });
    if (!res.ok) return;
    const data = await res.json();
    renderStatuses(data.statuses || []);
  } catch (err) {
    console.error("Status fetch error:", err);
  }
}

function renderStatuses(statuses) {
  const container = document.getElementById("statusContainer");
  if (!statuses || statuses.length === 0) {
    container.innerHTML = '<div class="empty-note">No requests yet. Ask for an intro above to get started.</div>';
    return;
  }

  container.innerHTML = statuses.map((item) => {
    const name = esc(item.respondent_name || "Your colleague");
    if (item.state === "pending") {
      return `
        <div class="card status-card">
          <div class="status-head">
            <span class="status-name">Waiting for ${name}'s agent</span>
            <span class="status-tag waiting">Pending</span>
          </div>
          <div class="status-body">Their personal agent is reviewing the request.</div>
        </div>`;
    }
    if (item.state === "matched") {
      const you = firstName(REQUESTER_ID);
      const them = displayName(item.respondent_name || "");
      return `
        <div class="card status-card">
          <div class="connection-created">
            <div class="connection-pair">
              <div class="avatar">${esc(initials(you))}</div>
              <div class="connection-line"></div>
              <div class="avatar">${esc(initials(them))}</div>
            </div>
            <div class="connection-caption">A new connection was made.</div>
            <div class="connection-sub">15 min · time to be coordinated</div>
          </div>
        </div>`;
    }
    if (item.state === "declined") {
      let bodyHtml;
      if (item.attachment) {
        let attHtml = "";
        if (item.attachment.type === "link") {
          const safe = /^https?:\/\//.test(item.attachment.content) ? esc(item.attachment.content) : "#";
          attHtml = `<div class="attachment-box">Shared link: <a href="${safe}" target="_blank" rel="noopener">${esc(item.attachment.content)}</a></div>`;
        } else if (item.attachment.type === "doc") {
          attHtml = `<div class="attachment-box">Shared document: <a href="${withKey('/attachments/' + encodeURIComponent(item.attachment.content))}" target="_blank">${esc(item.attachment.content)}</a></div>`;
        } else {
          attHtml = `<div class="attachment-box">${esc(item.attachment.content)}</div>`;
        }
        bodyHtml = `${name} shared a resource instead.${attHtml}`;
      } else {
        bodyHtml = `${name} can't make it this time.${item.decline_reason ? ` <em>"${esc(item.decline_reason)}"</em>` : ""}`;
      }
      return `
        <div class="card status-card">
          <div class="status-head">
            <span class="status-name">${name}</span>
            <span class="status-tag ${item.attachment ? "shared" : "waiting"}">${item.attachment ? "Shared" : "Unavailable"}</span>
          </div>
          <div class="status-body">${bodyHtml}</div>
        </div>`;
    }
    return "";
  }).join("");
}

// -------------------------------------------------------------------------
// Boot
// -------------------------------------------------------------------------

setupChrome();
initPrincipal().then(() => {
  fetchDigest();
  fetchStatuses();
});
  </script>
</body>
</html>
