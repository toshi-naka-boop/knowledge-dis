<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Discovery — Connection Requests</title>
  <style>
/* Knowledge Discovery — shared UI (Phase 1 redesign), reused here verbatim.
   Principle: humans are large, agents are small. No robot/brain icons.
   Light theme. Warm accent reserved for a made connection only.
   NOTE: server.py serves only /requester /candidate /audit as raw HTML files
   (no static mount for this directory), so this file's content is inlined
   into candidate.html's <style> tag rather than linked. Keep both in sync
   with web/ui.css / requester.html. */

:root {
  --bg: #F7F5F1;
  --card-bg: #FFFFFF;
  --border: #E4DFD3;
  --border-strong: #D4CDBC;
  --text: #232323;
  --text-muted: #6B6659;
  --text-faint: #948E7D;
  --primary: #1F3A5F;
  --primary-hover: #16304F;
  --primary-tint: #EAF0F6;
  --accent: #C96F4A;      /* used only when a connection is made */
  --accent-tint: #FBEEE7;
  --warn: #B5560C;        /* overdue: warm, but distinct from the connection accent */
  --warn-tint: #FBEFE3;
  --muted-tag-bg: #EFEBE1;
  --muted-tag-text: #6B6659;
  --today-bg: #EAF0F6;
  --today-text: #1F3A5F;
  --radius: 8px;
  --radius-sm: 6px;
  --shadow-card: 0 1px 2px rgba(35, 35, 35, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }

html, body { background: var(--bg); color: var(--text); }
body { min-height: 100vh; font-size: 14px; line-height: 1.5; }

a { color: inherit; }

button {
  font-family: var(--font);
  cursor: pointer;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
button.btn-primary { background: var(--primary); color: #fff; }
button.btn-primary:hover { background: var(--primary-hover); }
button.btn-primary:disabled { opacity: 0.6; cursor: default; }
button.btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border-strong); }
button.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
button.btn-secondary:disabled { opacity: 0.6; cursor: default; }
button.btn-text { background: transparent; color: var(--text-muted); padding: 4px 8px; font-size: 12px; }
button.btn-text:hover { color: var(--primary); }
button.btn-text:disabled { opacity: 0.6; cursor: default; }

textarea, input[type="text"], select {
  width: 100%;
  font-family: var(--font);
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  resize: vertical;
}
textarea:focus, input[type="text"]:focus, select:focus { outline: none; border-color: var(--primary); }

/* ---------------- App shell ---------------- */

.app-shell { display: flex; min-height: 100vh; align-items: stretch; }

.sidebar {
  width: 220px;
  flex: 0 0 220px;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
}
.sidebar-logo { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.01em; margin-bottom: 32px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav a {
  display: block;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 9px 10px;
  border-radius: var(--radius-sm);
}
.sidebar-nav a:hover { background: var(--bg); color: var(--text); }
.sidebar-nav a.active { background: var(--primary-tint); color: var(--primary); }
.sidebar-spacer { flex: 1; }
.sidebar-footer { font-size: 11px; color: var(--text-faint); line-height: 1.5; font-style: italic; }

.main { flex: 1; min-width: 0; padding: 36px 40px 60px; }
.main-inner { max-width: 880px; margin: 0 auto; }

.api-key-warning { background: var(--warn); color: #fff; padding: 8px 16px; font-size: 13px; margin: -36px -40px 24px; }

/* ---------------- Header ---------------- */

.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
.greeting { font-size: 22px; font-weight: 600; color: var(--text); }
.agent-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); display: inline-block; animation: dot-pulse 2.2s infinite; }
@keyframes dot-pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }

.persona-select {
  font-size: 12px;
  color: var(--text-muted);
  background: #fff;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 5px 12px;
}

/* ---------------- Section / cards ---------------- */

.section { margin-bottom: 28px; }
.empty-note { font-size: 13px; color: var(--text-faint); padding: 10px 2px; }

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 18px 20px;
}
.card + .card { margin-top: 14px; }

.tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }

/* ---------------- Person (requester) header ---------------- */

.avatar {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--primary-tint);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 14px;
}
.requester-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.requester-name { font-size: 15px; font-weight: 600; color: var(--text); }
.requester-label { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }

/* ---------------- Ask card body ---------------- */

.field-block { margin-bottom: 14px; }
.field-label { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.field-value { font-size: 14px; color: var(--text); line-height: 1.5; }

.reason-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.reason-list li { font-size: 13px; color: var(--text); padding-left: 14px; position: relative; line-height: 1.5; }
.reason-list li::before { content: "–"; position: absolute; left: 0; color: var(--text-faint); }
.ai-disclosure { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
.private-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; display: flex; align-items: flex-start; gap: 6px; }

.assessment-list { display: flex; flex-direction: column; gap: 4px; }
.assessment-row { font-size: 13px; color: var(--text); }
.assessment-row strong { color: var(--text-muted); font-weight: 500; }

.privacy-summary {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.5;
}

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.response-panel { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); display: none; }
.response-panel textarea { margin-bottom: 10px; }
.form-row { display: grid; grid-template-columns: 130px 1fr; gap: 8px; margin-bottom: 10px; }

.already-answered { font-size: 12px; color: var(--text-faint); font-style: italic; }

/* ---------------- Answered state ---------------- */

.status-result { display: flex; align-items: center; gap: 10px; }
.status-result .tag.accepted { background: var(--accent-tint); color: var(--accent); }
.status-result .tag.shared { background: var(--today-bg); color: var(--today-text); }
.status-result .tag.passed { background: var(--muted-tag-bg); color: var(--muted-tag-text); }
.status-result-text { font-size: 14px; color: var(--text); font-weight: 500; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo">Knowledge Discovery</div>
      <nav class="sidebar-nav">
        <a id="navRequester" href="/requester">My Agent</a>
        <a href="/candidate" class="active">Connection Requests</a>
        <a id="navAudit" href="/audit">Bridge Trace</a>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-footer">AI shouldn't replace human connections. It should create them.</div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <div class="page-header">
          <div>
            <div class="greeting">Connection Requests</div>
            <div class="agent-badge"><span class="pulse-dot"></span> <span id="screenedLabel">Your agent screened a request</span></div>
          </div>
          <!-- Demo device: one-person-plays-all dropdown (README: demo simplification). Hidden for a "human" principal. -->
          <select id="agentSelector" class="persona-select" onchange="loadAsksForAgent()" title="Demo: switch which agent's inbox you are viewing">
            <option value="agent_marcus_delgado">Marcus Delgado — Commercial Broker (Real Estate)</option>
            <option value="agent_rachel_kim">Rachel Kim — Senior Account Manager (Staffing)</option>
            <option value="agent_elena_vasquez">Elena Vasquez — Transition Advisor (M&amp;A / Succession)</option>
            <option value="agent_tom_whitfield">Tom Whitfield — Senior Accountant (Corporate Services)</option>
          </select>
        </div>

        <div class="section" id="asksContainer">
          <div class="empty-note">Loading received requests...</div>
        </div>
      </div>
    </main>
  </div>

  <script>
/* Knowledge Discovery — Connection Requests (candidate) UI logic, Phase 2 redesign. */

const API_KEY = (new URLSearchParams(location.search)).get("api_key") || "";

function formatId(id) {
  // "emp_jordan_lee" -> "Jordan Lee"
  return String(id).replace(/^(emp|agent)_/, "").split("_")
    .map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(" ");
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function withKey(path) {
  return path + (path.includes("?") ? "&" : "?") + "api_key=" + encodeURIComponent(API_KEY);
}

function initials(fullName) {
  const parts = String(fullName || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function setupChrome() {
  if (!API_KEY) {
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="api-key-warning">Missing api_key: open this page as /candidate?api_key=YOUR_KEY</div>');
  }
  const reqLink = document.getElementById("navRequester");
  const auditLink = document.getElementById("navAudit");
  if (reqLink) reqLink.href = withKey("/requester");
  if (auditLink) auditLink.href = withKey("/audit");
}

// -------------------------------------------------------------------------
// Requester identity resolution: the asks payload does not currently carry
// a requester identifier, so this degrades to a generic label rather than
// guessing. If a future payload adds one (requester_id / requester_name /
// from), this picks it up and resolves it against /api/agents.
// -------------------------------------------------------------------------

let AGENT_DIRECTORY = {};

async function loadAgentDirectory() {
  try {
    const res = await fetch(`/api/agents`, { headers: { "X-API-Key": API_KEY } });
    if (!res.ok) return;
    const data = await res.json();
    (data.agents || []).forEach((a) => {
      AGENT_DIRECTORY[a.agent_id] = a.display_name;
      if (a.employee_id) AGENT_DIRECTORY[a.employee_id] = a.display_name;
    });
  } catch (err) {
    console.error("agents fetch error:", err);
  }
}

function requesterDisplayName(ask) {
  const raw = ask.requester_display_name || ask.requester_name || ask.requester_id || ask.from || "";
  if (!raw) return "A colleague";
  if (AGENT_DIRECTORY[raw]) return AGENT_DIRECTORY[raw];
  return /^(emp|agent)_/.test(String(raw)) ? formatId(raw) : raw;
}

// -------------------------------------------------------------------------
// Principal resolution (§16.1, FR25-26): a "human" caller is pinned to the
// agent bound to their own employee_id and cannot switch via the dropdown.
// -------------------------------------------------------------------------

async function initPrincipal() {
  try {
    const meRes = await fetch(`/api/me`, { headers: { "X-API-Key": API_KEY } });
    if (!meRes.ok) return;
    const me = await meRes.json();
    if (me.mode !== "human" || !me.employee_id) return;

    const agentsRes = await fetch(`/api/agents`, { headers: { "X-API-Key": API_KEY } });
    if (!agentsRes.ok) return;
    const agentsData = await agentsRes.json();
    const own = (agentsData.agents || []).find((a) => a.employee_id === me.employee_id);
    if (!own) return;

    const sel = document.getElementById("agentSelector");
    if (sel) {
      sel.value = own.agent_id;
      sel.style.display = "none";
    }
  } catch (err) {
    console.error("me fetch error:", err);
  }
}

async function loadAsksForAgent() {
  const agentId = document.getElementById("agentSelector").value;
  const container = document.getElementById("asksContainer");
  container.innerHTML = `<div class="empty-note">Fetching requests for ${esc(agentId)}...</div>`;

  try {
    const res = await fetch(`/api/candidate/${agentId}/asks`, {
      headers: { "X-API-Key": API_KEY }
    });
    if (!res.ok) {
      container.innerHTML = `<div class="empty-note">Error fetching requests.</div>`;
      return;
    }
    const data = await res.json();
    renderAsks(data.asks || []);
  } catch (err) {
    container.innerHTML = `<div class="empty-note">Connection error: ${esc(err.message)}</div>`;
  }
}

function relevanceLabel(score) {
  if (score === undefined || score === null) return "";
  return score >= 0.75 ? "High" : "Moderate";
}

function reasonBullets(reasonText) {
  const text = String(reasonText || "").trim();
  if (!text) return [];
  return text
    .split(/(?<=[.;])\s+/)
    .map((s) => s.trim())
    .filter(Boolean);
}

// Local memory of how a request was just answered in this session (decision +
// whether an attachment was sent). The GET /asks payload only exposes
// consent_state ("granted"/"declined"), not whether a decline carried an
// attachment, so a plain reload cannot tell "shared a resource" apart from
// "passed" -- this map lets the UI show the precise outcome right after the
// user's own action, and falls back to a decision-only message otherwise.
const LOCAL_OUTCOME = {};

function renderAsks(asks) {
  const container = document.getElementById("asksContainer");
  const label = document.getElementById("screenedLabel");
  label.innerText = asks.length > 1
    ? `Your agent screened ${asks.length} requests`
    : "Your agent screened a request";

  if (!asks || asks.length === 0) {
    container.innerHTML = `<div class="empty-note">No incoming requests for this agent.</div>`;
    return;
  }

  container.innerHTML = asks.map((ask) => renderAskCard(ask)).join("");
}

function renderAskCard(ask) {
  const auditId = ask.ask_audit_id;
  const isPrivate = ask.is_private || ask.intent === "connect_ask_private";
  const isPending = (ask.consent_state === "pending" || ask.consent_state === "n/a");
  const relevance = relevanceLabel(ask.score);
  const bullets = reasonBullets(ask.reason_text);
  const name = requesterDisplayName(ask);
  const avatarText = (name === "A colleague") ? "?" : initials(name);

  if (!isPending) {
    return `
      <div class="card status-result" id="ask_card_${esc(auditId)}">
        <div class="avatar">${esc(avatarText)}</div>
        <div class="status-result-text">${resultText(ask)}</div>
      </div>`;
  }

  return `
    <div class="card" id="ask_card_${esc(auditId)}">
      <div class="requester-row">
        <div class="avatar">${esc(avatarText)}</div>
        <div>
          <div class="requester-label">Requester</div>
          <div class="requester-name">${esc(name)}</div>
        </div>
      </div>

      <div class="field-block">
        <div class="field-label">What they need help with</div>
        <div class="field-value">${esc(ask.question_summary) || "A colleague inquiry"}</div>
      </div>

      <div class="field-block">
        <div class="field-label">Why you?</div>
        <ul class="reason-list">${bullets.map((b) => `<li>${esc(b)}</li>`).join("") || `<li>${esc(ask.reason_text) || "Relevant experience detected."}</li>`}</ul>
        <div class="ai-disclosure">🤖 AI-generated</div>
        ${isPrivate ? `<div class="private-note">🔒 Relates to something only your agent knows about you — nothing has been shared.</div>` : ""}
      </div>

      <div class="field-block">
        <div class="field-label">Agent assessment</div>
        <div class="assessment-list">
          ${relevance ? `<div class="assessment-row"><strong>Relevance:</strong> ${relevance}</div>` : ""}
          <div class="assessment-row"><strong>Time:</strong> 15 min</div>
          <div class="assessment-row"><strong>Shared with you:</strong> question summary + why-you note</div>
        </div>
      </div>

      <div class="field-block">
        <div class="field-label">Privacy summary</div>
        <div class="privacy-summary">
          Shared between agents: the question and the AI-generated why-you note.<br>
          Not shared: your private profile items, calendars, or messages.
        </div>
      </div>

      <div class="btn-row" id="actions_${esc(auditId)}">
        <button class="btn-primary" onclick="acceptAsk('${esc(auditId)}')">Accept</button>
        <button class="btn-secondary" onclick="togglePanel('${esc(auditId)}', 'share')">Share a resource instead</button>
        <button class="btn-text" onclick="togglePanel('${esc(auditId)}', 'pass')">Not this time</button>
      </div>

      <div id="sharePanel_${esc(auditId)}" class="response-panel">
        <div class="form-row">
          <select id="attType_${esc(auditId)}" onchange="updateAttachmentPlaceholder('${esc(auditId)}')">
            <option value="link">Link (URL)</option>
            <option value="doc">Document ID</option>
            <option value="text">Text Note</option>
          </select>
          <input type="text" id="attContent_${esc(auditId)}" placeholder="https://wiki.internal/clinic-relocation" value="https://wiki.internal/clinic-relocation">
        </div>
        <textarea id="shareNote_${esc(auditId)}" placeholder="Optional note to include..."></textarea>
        <div class="btn-row">
          <button class="btn-primary" onclick="submitShare('${esc(auditId)}')">Send resource</button>
          <button class="btn-text" onclick="togglePanel('${esc(auditId)}', 'share')">Cancel</button>
        </div>
      </div>

      <div id="passPanel_${esc(auditId)}" class="response-panel">
        <textarea id="passReason_${esc(auditId)}" placeholder="Let them know why (optional)..."></textarea>
        <div class="btn-row">
          <button class="btn-secondary" onclick="submitPass('${esc(auditId)}')">Confirm</button>
          <button class="btn-text" onclick="togglePanel('${esc(auditId)}', 'pass')">Cancel</button>
        </div>
      </div>
    </div>`;
}

function resultText(ask) {
  const local = LOCAL_OUTCOME[ask.ask_audit_id];
  if (local) {
    if (local.decision === "granted") return "You accepted — a 15-min intro will be proposed.";
    return local.hasAttachment ? "You shared a resource instead." : "You passed this time.";
  }
  if (ask.consent_state === "granted") {
    return "You accepted — a 15-min intro will be proposed.";
  }
  if (ask.consent_state === "declined") {
    return "You already responded to this request.";
  }
  return "You already responded to this request.";
}

function togglePanel(auditId, which) {
  const other = which === "share" ? "pass" : "share";
  const panel = document.getElementById(`${which}Panel_${auditId}`);
  const otherPanel = document.getElementById(`${other}Panel_${auditId}`);
  if (otherPanel) otherPanel.style.display = "none";
  if (panel) panel.style.display = (panel.style.display === "block") ? "none" : "block";
}

function updateAttachmentPlaceholder(auditId) {
  const type = document.getElementById(`attType_${auditId}`).value;
  const input = document.getElementById(`attContent_${auditId}`);
  if (type === "link") {
    input.value = "https://wiki.internal/clinic-relocation";
  } else if (type === "doc") {
    input.value = "doc_clinic_relocation_guide";
  } else {
    input.value = "Please refer to standard outpatient guidelines.";
  }
}

function disableActions(auditId, message) {
  const actions = document.getElementById(`actions_${auditId}`);
  if (!actions) return;
  actions.querySelectorAll("button").forEach((b) => (b.disabled = true));
  actions.insertAdjacentHTML("beforeend", `<span class="already-answered">${esc(message)}</span>`);
}

async function acceptAsk(auditId) {
  LOCAL_OUTCOME[auditId] = { decision: "granted", hasAttachment: false };
  await submitConsent(auditId, "granted", "", null);
}

async function submitShare(auditId) {
  const note = document.getElementById(`shareNote_${auditId}`)?.value.trim() || "";
  const attType = document.getElementById(`attType_${auditId}`)?.value;
  const attContent = document.getElementById(`attContent_${auditId}`)?.value.trim();
  const attachment = attContent ? { type: attType, content: attContent } : null;
  LOCAL_OUTCOME[auditId] = { decision: "declined", hasAttachment: !!attachment };
  await submitConsent(auditId, "declined", note, attachment);
}

async function submitPass(auditId) {
  const reason = document.getElementById(`passReason_${auditId}`)?.value.trim() || "Currently unable to participate.";
  LOCAL_OUTCOME[auditId] = { decision: "declined", hasAttachment: false };
  await submitConsent(auditId, "declined", reason, null);
}

async function submitConsent(auditId, decision, reasonText, attachment) {
  const agentId = document.getElementById("agentSelector").value;
  const actions = document.getElementById(`actions_${auditId}`);
  if (actions) actions.querySelectorAll("button").forEach((b) => (b.disabled = true));

  try {
    const res = await fetch(`/api/candidate/${agentId}/consent`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": API_KEY,
      },
      body: JSON.stringify({
        ask_audit_id: auditId,
        decision: decision,
        reason_text: reasonText,
        attachment: attachment
      })
    });

    if (res.status === 409) {
      disableActions(auditId, "Already answered");
      return;
    }
    if (!res.ok) {
      const errData = await res.json();
      alert("Failed to submit response: " + (errData.detail || "Unknown error"));
      if (actions) actions.querySelectorAll("button").forEach((b) => (b.disabled = false));
      return;
    }

    await loadAsksForAgent();
  } catch (err) {
    alert("Connection error: " + err.message);
    if (actions) actions.querySelectorAll("button").forEach((b) => (b.disabled = false));
  }
}

// Initial load
window.addEventListener("DOMContentLoaded", () => {
  setupChrome();
  loadAgentDirectory().then(() => {
    initPrincipal().then(loadAsksForAgent);
  });
});
  </script>
</body>
</html>
