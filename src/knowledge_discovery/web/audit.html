<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Discovery — Bridge Trace</title>
  <style>
/* Knowledge Discovery — Bridge Trace (Phase 2 redesign)
   Same design tokens / app-shell as requester.html (Phase 1), inlined here
   because server.py serves this file as a raw HTML shell (no static mount).
   Light theme; this screen is allowed to feel a little more technical than
   requester/candidate, but no black background, neon, or cyberpunk styling. */

:root {
  --bg: #F7F5F1;
  --card-bg: #FFFFFF;
  --border: #E4DFD3;
  --border-strong: #D4CDBC;
  --text: #232323;
  --text-muted: #6B6659;
  --text-faint: #948E7D;
  --primary: #1F3A5F;
  --primary-hover: #16304F;
  --primary-tint: #EAF0F6;
  --accent: #C96F4A;      /* used only when a connection is made */
  --accent-tint: #FBEEE7;
  --warn: #B5560C;        /* overdue: warm, but distinct from the connection accent */
  --warn-tint: #FBEFE3;
  --danger: #B3261E;
  --danger-tint: #FBEAE8;
  --muted-tag-bg: #EFEBE1;
  --muted-tag-text: #6B6659;
  --today-bg: #EAF0F6;
  --today-text: #1F3A5F;
  --radius: 8px;
  --radius-sm: 6px;
  --shadow-card: 0 1px 2px rgba(35, 35, 35, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }

html, body { background: var(--bg); color: var(--text); }
body { min-height: 100vh; font-size: 14px; line-height: 1.5; }

a { color: inherit; }

button {
  font-family: var(--font);
  cursor: pointer;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
button.btn-text { background: transparent; color: var(--text-muted); padding: 4px 8px; font-size: 12px; }
button.btn-text:hover { color: var(--primary); }

/* ---------------- App shell (shared with requester/candidate) ---------------- */

.app-shell { display: flex; min-height: 100vh; align-items: stretch; }

.sidebar {
  width: 220px;
  flex: 0 0 220px;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
}
.sidebar-logo { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.01em; margin-bottom: 32px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav a {
  display: block;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 9px 10px;
  border-radius: var(--radius-sm);
}
.sidebar-nav a:hover { background: var(--bg); color: var(--text); }
.sidebar-nav a.active { background: var(--primary-tint); color: var(--primary); }
.sidebar-spacer { flex: 1; }

.main { flex: 1; min-width: 0; padding: 36px 40px 60px; }
.main-inner { max-width: 1180px; margin: 0 auto; }

.api-key-warning { background: var(--warn); color: #fff; padding: 8px 16px; font-size: 13px; margin: -36px -40px 24px; }

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 18px 20px;
}

/* ---------------- Header ---------------- */

.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.greeting { font-size: 22px; font-weight: 600; color: var(--text); }
.page-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
.live-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--primary); }
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); display: inline-block; animation: dot-pulse 2.2s infinite; }
@keyframes dot-pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }

/* ---------------- Funnel summary (secondary, one-line, small) ---------------- */

.trace-funnel {
  font-size: 12px;
  color: var(--text-faint);
  margin: -4px 0 22px;
}
.trace-funnel .tf-num { font-weight: 600; color: var(--text-muted); }

/* ---------------- Two-column layout ---------------- */

.trace-columns { display: flex; gap: 24px; align-items: flex-start; }
.trace-network-col { flex: 0 0 63%; max-width: 63%; }
.trace-timeline-col { flex: 1; min-width: 0; }

.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.section-title-primary {
  font-size: 14px;
  color: var(--text);
  letter-spacing: 0.02em;
}

/* ---------------- Agent Network (SVG) ---------------- */

.trace-network-card { padding: 12px; }
.trace-network-card svg { width: 100%; height: auto; display: block; }

.na-agent-dot { fill: var(--card-bg); stroke-width: 2; transform-box: fill-box; transform-origin: 50% 50%; }
.na-agent-label { font-size: 11px; fill: var(--text-muted); font-weight: 500; }
.na-center-dot { fill: var(--primary); transform-box: fill-box; transform-origin: 50% 50%; }
.na-center-label { font-size: 12px; fill: var(--text); font-weight: 600; }

.na-edge { fill: none; }
.na-edge-idle { stroke: var(--border-strong); stroke-width: 1.5; }
.na-edge-asked { stroke: var(--primary); stroke-width: 2; }
.na-edge-dropped { stroke: var(--text-faint); stroke-width: 1.5; stroke-dasharray: 3 5; }
.na-edge-warm { stroke: var(--accent); stroke-width: 2.5; }

.na-person { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; transform-box: fill-box; transform-origin: 50% 50%; }
.na-person-label { font-size: 11px; font-weight: 700; fill: var(--accent); }
.na-person-name { font-size: 11px; font-weight: 600; fill: var(--text); }

.na-lock { font-size: 12px; }

@keyframes nodePulse {
  0% { transform: scale(1); }
  35% { transform: scale(1.5); }
  100% { transform: scale(1); }
}
.na-pulse { animation: nodePulse 0.9s ease-out 1; }

.trace-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--text-muted); }
.trace-legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend-swatch { width: 14px; height: 2px; display: inline-block; }

/* ---------------- Match Found card (below the network) ---------------- */

.match-found-wrap { margin-top: 16px; }
.match-found-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.match-found-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--accent-tint);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.match-found-avatar {
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 2px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  font-weight: 700;
  color: var(--accent);
}
.match-found-name { font-size: 19px; font-weight: 700; color: var(--text); }
.match-found-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }

/* ---------------- Trace Timeline ---------------- */

.trace-timeline {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 640px;
  overflow-y: auto;
  padding-right: 2px;
}

.trace-row {
  display: flex;
  gap: 12px;
  padding: 10px 12px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.trace-time {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  padding-top: 1px;
  white-space: nowrap;
}
.trace-body { flex: 1; min-width: 0; }
.trace-action { font-size: 13px; font-weight: 600; color: var(--text); word-break: break-word; }
.trace-subline { font-size: 12px; margin-top: 4px; color: var(--text-muted); word-break: break-word; }
.trace-subline .trace-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-faint);
  margin-right: 6px;
}
.trace-row.policy-blocked { background: var(--danger-tint); border-color: var(--danger); }
.trace-row.policy-blocked .trace-action { color: var(--danger); }
.trace-row.policy-blocked .trace-subline.trace-policy .trace-label { color: var(--danger); }
.trace-row.trace-outcome-match { background: var(--accent-tint); border-color: var(--accent); }
.trace-row.trace-outcome-match .trace-action { color: var(--accent); }
.trace-subline.trace-policy { color: var(--warn); }
.trace-subline.trace-policy .trace-label { color: var(--warn); }
.trace-subline.trace-outcome { color: var(--accent); font-weight: 600; }
.trace-subline.trace-outcome .trace-label { color: var(--accent); }

.empty-note { font-size: 13px; color: var(--text-faint); padding: 10px 2px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo">Knowledge Discovery</div>
      <nav class="sidebar-nav">
        <a id="navRequester" href="/requester">My Agent</a>
        <a id="navCandidate" href="/candidate">Connection Requests</a>
        <a href="/audit" class="active">Bridge Trace</a>
      </nav>
      <div class="sidebar-spacer"></div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <div class="page-header">
          <div>
            <div class="greeting">Bridge Trace</div>
            <div class="page-sub">How your agent explored the organization and found a person.</div>
          </div>
          <span class="live-indicator"><span class="pulse-dot"></span> Live (3s)</span>
        </div>

        <div class="trace-funnel" id="traceFunnel">
          <span class="empty-note" style="padding: 0;">Loading funnel…</span>
        </div>

        <div class="trace-columns">
          <div class="trace-network-col">
            <div class="section-title section-title-primary">Agent Network</div>
            <div class="card trace-network-card">
              <svg id="networkSvg" viewBox="0 0 640 580" xmlns="http://www.w3.org/2000/svg">
                <text x="320" y="280" text-anchor="middle" class="na-agent-label">Loading…</text>
              </svg>
              <div class="trace-legend">
                <span><span class="legend-swatch" style="background: var(--primary);"></span> Asked</span>
                <span><span class="legend-swatch" style="background: var(--text-faint); border-top: 2px dashed var(--text-faint); height:0;"></span> No connection</span>
                <span><span class="legend-swatch" style="background: var(--accent);"></span> Connection made</span>
              </div>
            </div>
            <div class="match-found-wrap" id="matchFoundCard" style="display: none;"></div>
          </div>

          <div class="trace-timeline-col">
            <div class="section-title">Trace Timeline · latest session</div>
            <div class="trace-timeline" id="traceTimeline">
              <div class="empty-note">Loading trace events…</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
const API_KEY = (new URLSearchParams(location.search)).get("api_key") || "";

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function withKey(path) {
  return path + (path.includes("?") ? "&" : "?") + "api_key=" + encodeURIComponent(API_KEY);
}

function setupChrome() {
  if (!API_KEY) {
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="api-key-warning">Missing api_key: open this page as /audit?api_key=YOUR_KEY</div>');
  }
  const reqLink = document.getElementById("navRequester");
  const candLink = document.getElementById("navCandidate");
  if (reqLink) reqLink.href = withKey("/requester");
  if (candLink) candLink.href = withKey("/candidate");
}

// -------------------------------------------------------------------------
// Display name resolution: /api/agents first, then formatted ID (no
// hardcoded roster — this view must reflect exactly what the backend has
// registered).
// -------------------------------------------------------------------------

let AGENTS = [];
const AGENTS_BY_ID = {};
const AGENTS_BY_EMPLOYEE = {};

function formatId(id) {
  const stripped = String(id || "").replace(/^emp_/, "").replace(/^agent_/, "");
  return stripped.split("_").filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ") || id;
}

function resolveName(id) {
  if (!id) return "Unknown";
  if (id === "system") return "System";
  if (AGENTS_BY_ID[id]) return AGENTS_BY_ID[id].display_name;
  if (AGENTS_BY_EMPLOYEE[id]) return AGENTS_BY_EMPLOYEE[id].display_name;
  return formatId(id);
}

function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

async function fetchAgents() {
  try {
    const res = await fetch("/api/agents", { headers: { "X-API-Key": API_KEY } });
    if (!res.ok) return;
    const data = await res.json();
    AGENTS = data.agents || [];
    AGENTS.forEach(a => {
      AGENTS_BY_ID[a.agent_id] = a;
      AGENTS_BY_EMPLOYEE[a.employee_id] = a;
    });
  } catch (err) {
    console.error("Agents fetch error:", err);
  }
}

// -------------------------------------------------------------------------
// Fetch + render loop
// -------------------------------------------------------------------------

let PREV_RECORD_COUNT = 0;
let PREV_AGENT_STATE = {};

// -------------------------------------------------------------------------
// Session splitting: a "discovery session" starts at a query record and
// runs up to (not including) the next query record. Single-tenant timeline,
// so a simple linear split by intent === "query" boundaries is sufficient.
// -------------------------------------------------------------------------

function splitIntoSessions(records) {
  const sessions = [];
  let current = null;
  for (const r of records) {
    if (r.intent === "query") {
      current = [];
      sessions.push(current);
    }
    if (current) current.push(r);
  }
  return sessions;
}

function latestSession(records) {
  const sessions = splitIntoSessions(records);
  return sessions.length ? sessions[sessions.length - 1] : [];
}

async function fetchTrace() {
  try {
    const res = await fetch("/api/audit/messages", { headers: { "X-API-Key": API_KEY } });
    if (!res.ok) return;
    const data = await res.json();
    const records = (data.records || []).slice().sort((a, b) => String(a.timestamp).localeCompare(String(b.timestamp)));
    const session = latestSession(records);
    renderFunnel(data.funnel_stats || {});
    renderNetwork(records);
    renderMatchCard(session);
    renderTimeline(session, data.funnel_stats || {});
    PREV_RECORD_COUNT = records.length;
  } catch (err) {
    console.error("Trace fetch error:", err);
  }
}

function renderFunnel(stats) {
  const el = document.getElementById("traceFunnel");
  el.innerHTML = `Explored <span class="tf-num">${esc(stats.total_profiles ?? "0")}</span> profiles ` +
    `&middot; shortlisted <span class="tf-num">${esc(stats.funnel_limit ?? "0")}</span> ` +
    `&middot; asked <span class="tf-num">${esc(stats.dispatched_count ?? "0")}</span> agents`;
}

function renderMatchCard(sessionRecords) {
  const container = document.getElementById("matchFoundCard");
  const rec = sessionRecords.find(r => r.intent === "match_proposal");
  if (!rec) {
    container.style.display = "none";
    container.innerHTML = "";
    return;
  }
  const payload = rec.display_payload || {};
  const participants = payload.participants || [];
  const requesterName = resolveName(participants[0]);
  const candidateName = resolveName(participants[1]);
  container.style.display = "";
  container.innerHTML = `
    <div class="match-found-label">Match Found</div>
    <div class="match-found-card">
      <div class="match-found-avatar">${esc(initials(candidateName))}</div>
      <div>
        <div class="match-found-name">${esc(candidateName)}</div>
        <div class="match-found-sub">Connected with ${esc(requesterName)} &middot; ${esc(payload.meeting_duration ?? 15)} min</div>
      </div>
    </div>`;
}

// -------------------------------------------------------------------------
// Agent Network (SVG): derive per-candidate state from the message stream.
// -------------------------------------------------------------------------

function deriveAgentState(records) {
  const state = {}; // agent_id -> { stage, private, requesterName }
  for (const r of records) {
    const payload = r.display_payload || {};
    if (r.intent === "no_connection") {
      state[r.to] = { stage: "dropped" };
    } else if (r.intent === "connect_ask") {
      state[r.to] = { stage: "asked", private: false };
    } else if (r.intent === "connect_ask_private") {
      state[r.to] = { stage: "asked", private: true };
    } else if (r.intent === "consent_reply" && payload.decision === "granted") {
      const prev = state[r.from] || {};
      state[r.from] = { ...prev, stage: "consent_granted" };
    } else if (r.intent === "consent_reply" && payload.decision === "declined") {
      const prev = state[r.from] || {};
      if (prev.stage !== "matched") state[r.from] = { ...prev, stage: "dropped" };
    } else if (r.intent === "match_proposal") {
      const participants = payload.participants || [];
      const requesterId = participants[0];
      const candidateEmployeeId = participants[1];
      const candAgent = AGENTS_BY_EMPLOYEE[candidateEmployeeId];
      if (candAgent) {
        const prev = state[candAgent.agent_id] || {};
        state[candAgent.agent_id] = { ...prev, stage: "matched", requesterName: resolveName(requesterId) };
      }
    }
  }
  return state;
}

function renderNetwork(records) {
  const svg = document.getElementById("networkSvg");
  const cx = 320, cy = 280, radius = 205;
  const n = AGENTS.length;
  const agentState = deriveAgentState(records);

  const newQueryCount = records.filter(r => r.intent === "query").length;
  const centerPulse = (newQueryCount > 0 && records.length > PREV_RECORD_COUNT && PREV_RECORD_COUNT > 0) ? "na-pulse" : "";

  let svgParts = [];

  // Center: "Your agent"
  svgParts.push(`<circle cx="${cx}" cy="${cy}" r="7" class="na-center-dot ${centerPulse}"></circle>`);
  svgParts.push(`<text x="${cx}" y="${cy + 24}" text-anchor="middle" class="na-center-label">Your agent</text>`);

  if (n === 0) {
    svgParts.push(`<text x="${cx}" y="${cy - 24}" text-anchor="middle" class="na-agent-label">No registered agents yet.</text>`);
  }

  AGENTS.forEach((agent, i) => {
    const angle = (-90 + (360 / n) * i) * (Math.PI / 180);
    const nx = cx + radius * Math.cos(angle);
    const ny = cy + radius * Math.sin(angle);
    const st = agentState[agent.agent_id] || { stage: "idle" };

    let edgeClass = "na-edge-idle";
    if (st.stage === "asked") edgeClass = "na-edge-asked";
    else if (st.stage === "dropped") edgeClass = "na-edge-dropped";
    else if (st.stage === "consent_granted" || st.stage === "matched") edgeClass = "na-edge-warm";

    const prevSt = PREV_AGENT_STATE[agent.agent_id];
    const changed = PREV_RECORD_COUNT > 0 && (!prevSt || prevSt.stage !== st.stage);
    const nodePulse = changed ? "na-pulse" : "";

    svgParts.push(`<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" class="na-edge ${edgeClass}"></line>`);
    svgParts.push(`<circle cx="${nx}" cy="${ny}" r="9" class="na-agent-dot ${nodePulse}" style="stroke: ${edgeClass === 'na-edge-idle' ? 'var(--border-strong)' : (edgeClass === 'na-edge-warm' ? 'var(--accent)' : (edgeClass === 'na-edge-dropped' ? 'var(--text-faint)' : 'var(--primary)'))};"></circle>`);

    const labelDx = Math.cos(angle) >= 0 ? 14 : -14;
    const anchor = Math.cos(angle) >= 0 ? "start" : "end";
    const lockPrefix = st.private ? "🔒 " : "○ ";
    svgParts.push(`<text x="${nx + labelDx}" y="${ny + 4}" text-anchor="${anchor}" class="na-agent-label">${lockPrefix}${esc(agent.display_name)}</text>`);

    if (st.stage === "matched") {
      // Humans large, agents small: overlay a person avatar just outside
      // this agent's node, and one just outside the center, joined by a
      // warm Person—Person line.
      const px = cx + (radius + 46) * Math.cos(angle);
      const py = cy + (radius + 46) * Math.sin(angle);
      const hx = cx + 46 * Math.cos(angle);
      const hy = cy + 46 * Math.sin(angle);
      const candInitials = initials(agent.display_name);
      const reqName = st.requesterName || "Your agent";
      const reqInitials = initials(reqName);

      svgParts.push(`<line x1="${hx}" y1="${hy}" x2="${px}" y2="${py}" class="na-edge na-edge-warm" stroke-width="3"></line>`);
      svgParts.push(`<circle cx="${hx}" cy="${hy}" r="20" class="na-person"></circle>`);
      svgParts.push(`<text x="${hx}" y="${hy + 4}" text-anchor="middle" class="na-person-label">${esc(reqInitials)}</text>`);
      svgParts.push(`<circle cx="${px}" cy="${py}" r="20" class="na-person"></circle>`);
      svgParts.push(`<text x="${px}" y="${py + 4}" text-anchor="middle" class="na-person-label">${esc(candInitials)}</text>`);
      svgParts.push(`<text x="${(hx + px) / 2}" y="${(hy + py) / 2 - 26}" text-anchor="middle" class="na-person-name">${esc(reqName)} ↔ ${esc(agent.display_name)}</text>`);
    }
  });

  svg.innerHTML = svgParts.join("");
  PREV_AGENT_STATE = agentState;
}

// -------------------------------------------------------------------------
// Trace Timeline: convert each raw audit record into a human-readable event.
// -------------------------------------------------------------------------

function truncate(s, max) {
  const str = String(s || "");
  return str.length > max ? str.slice(0, max).trim() + "…" : str;
}

const MATCH_PROPOSAL_SEEN = new Set();

function recordToEvent(r, funnelStats) {
  const payload = r.display_payload || {};
  const owner = resolveName(r.to);
  const fromName = resolveName(r.from);
  let action = "";
  let sublines = [];
  let rowClass = "";

  if (r.rejected || r.intent === "reject_unregistered_type" || r.intent === "reject_unsupported_intent") {
    action = r.intent === "reject_unregistered_type"
      ? "Transmission rejected — unregistered payload type"
      : "Transmission rejected — unsupported intent";
    sublines.push({ label: "POLICY", text: "Blocked at the transmission layer", cls: "trace-policy" });
    rowClass = "policy-blocked";
  } else if (r.intent === "query") {
    action = "Need received — your agent starts searching";
    sublines.push({
      label: "EVIDENCE",
      text: `${esc(funnelStats.total_profiles ?? "?")} profiles → ${esc(funnelStats.funnel_limit ?? "?")} shortlisted → ${esc(funnelStats.registered_agents_count ?? "?")} candidate agents`,
      cls: "trace-evidence",
    });
  } else if (r.intent === "preview_search") {
    action = "Secretary previewed candidates — nothing delivered";
    sublines.push({ label: "POLICY", text: "content hidden (fail-closed)", cls: "trace-policy" });
  } else if (r.intent === "stagnation_detected") {
    action = "Stagnation detected by the secretary";
    sublines.push({ label: "POLICY", text: "content hidden (fail-closed)", cls: "trace-policy" });
  } else if (r.intent === "profile_diff_proposed") {
    action = "Profile addition proposed to owner";
    sublines.push({ label: "POLICY", text: "content hidden (fail-closed)", cls: "trace-policy" });
  } else if (r.intent === "connect_ask") {
    action = `Asked ${esc(owner)}'s agent — would they connect?`;
  } else if (r.intent === "connect_ask_private") {
    action = `Asked ${esc(owner)} privately`;
    sublines.push({ label: "POLICY", text: "🔒 based on a private item — content masked", cls: "trace-policy" });
  } else if (r.intent === "consent_reply") {
    action = payload.decision === "granted" ? `${esc(fromName)} accepted` : `${esc(fromName)} passed`;
  } else if (r.intent === "decline_with_reason") {
    if (payload.attachment) {
      action = `${esc(fromName)} shared a resource instead`;
    } else {
      action = `${esc(fromName)} passed`;
      if (payload.reason_text) {
        sublines.push({ label: "EVIDENCE", text: esc(truncate(payload.reason_text, 90)), cls: "trace-evidence" });
      }
    }
  } else if (r.intent === "match_proposal") {
    const askId = payload.ask_audit_id || r.audit_id;
    if (MATCH_PROPOSAL_SEEN.has(askId)) return null;
    MATCH_PROPOSAL_SEEN.add(askId);
    const participants = payload.participants || [];
    const requesterName = resolveName(participants[0]);
    const candidateName = resolveName(participants[1]);
    action = "Connection made";
    sublines.push({
      label: "OUTCOME",
      text: `Connection made: ${esc(requesterName)} ↔ ${esc(candidateName)} (${esc(payload.meeting_duration ?? 15)} min)`,
      cls: "trace-outcome",
    });
    rowClass = "trace-outcome-match";
  } else {
    action = r.intent;
    if (payload.masked && payload.note) {
      sublines.push({ label: "POLICY", text: esc(payload.note), cls: "trace-policy" });
    }
  }

  return { action, sublines, rowClass, timestamp: r.timestamp, auditId: r.audit_id };
}

// Collapse every no_connection record in the session into a single event
// (real data only: one representative reason, the rest counted not repeated).
function buildSessionEvents(sessionRecords, funnelStats) {
  MATCH_PROPOSAL_SEEN.clear();
  const noConnectionRecords = sessionRecords.filter(r => r.intent === "no_connection");
  let noConnectionAdded = false;
  const events = [];

  for (const r of sessionRecords) {
    if (r.intent === "no_connection") {
      if (noConnectionAdded) continue;
      noConnectionAdded = true;
      const rep = noConnectionRecords.find(nr => !nr.display_payload?.masked && nr.display_payload?.reason_text);
      const sublines = [];
      if (rep) {
        const repOwner = resolveName(rep.to);
        const others = noConnectionRecords.length - 1;
        const prefix = noConnectionRecords.length > 1 ? `${esc(repOwner)}: ` : "";
        const suffix = others > 0 ? ` (+${others} more)` : "";
        sublines.push({
          label: "EVIDENCE",
          text: `${prefix}${esc(truncate(rep.display_payload.reason_text, 90))}${suffix}`,
          cls: "trace-evidence",
        });
      }
      events.push({
        action: noConnectionRecords.length === 1
          ? `${esc(resolveName(r.to))}'s agent found no meaningful link`
          : `${noConnectionRecords.length} agents found no meaningful link`,
        sublines,
        rowClass: "",
        timestamp: r.timestamp,
        auditId: r.audit_id,
      });
      continue;
    }
    const ev = recordToEvent(r, funnelStats);
    if (ev) events.push(ev);
  }
  return events;
}

function renderTimeline(sessionRecords, funnelStats) {
  const container = document.getElementById("traceTimeline");

  if (sessionRecords.length === 0) {
    container.innerHTML = '<div class="empty-note">No discovery session yet.</div>';
    return;
  }

  const events = buildSessionEvents(sessionRecords, funnelStats);

  if (events.length === 0) {
    container.innerHTML = '<div class="empty-note">No trace events recorded yet.</div>';
    return;
  }

  container.innerHTML = events.map(ev => {
    const timeStr = ev.timestamp ? new Date(ev.timestamp).toLocaleTimeString() : "";
    const sublinesHtml = ev.sublines.map(s =>
      `<div class="trace-subline ${s.cls}"><span class="trace-label">${s.label}</span>${s.text}</div>`
    ).join("");
    return `
      <div class="trace-row ${ev.rowClass}">
        <div class="trace-time">${esc(timeStr)}</div>
        <div class="trace-body">
          <div class="trace-action">${ev.action}</div>
          ${sublinesHtml}
        </div>
      </div>`;
  }).join("");
}
